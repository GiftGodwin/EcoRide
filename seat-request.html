<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Request a seat | EcoRide</title>
  <link rel="icon" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="booking-flow.css">
</head>

<body data-page="seat-request">
  <header class="flow-header">
    <a class="flow-logo" href="index.html" aria-label="EcoRide home"><img src="images/in%20app%20logo.svg"
        alt="EcoRide"></a>
    <nav class="flow-nav" aria-label="Main navigation"><a href="passenger-dashboard.html">Home</a><a
        href="available-rides.html" class="active">Ride</a><a href="dashboard.html">Wallet</a><a
        href="safety-feedback.html">Help</a></nav>
    <div class="flow-account"><span class="flow-avatar" id="flow-avatar" hidden></span><span class="flow-user-name"
        id="flow-user-name"></span></div>
  </header>
  <div class="flow-back-wrap"><a class="flow-back" href="booking.html" id="flow-back"><svg viewBox="0 0 24 24"
        aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>Back</a></div>
  <main class="flow-main">
    <section class="flow-car"><img src="images/car.png" alt="Comfort ride vehicle">
      <div><strong>Comfort Ride</strong><span>Safe &nbsp;·&nbsp; Reliable &nbsp;·&nbsp; On time</span></div>
    </section>
    <section class="flow-card" aria-label="Seat request details">
      <div class="flow-route">
        <div class="flow-stop"><span class="flow-pin" aria-hidden="true"><svg viewBox="0 0 24 24">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg></span>
          <div><small>From</small><strong id="sr-from">—</strong><span class="detail" id="sr-pickup"></span></div>
        </div>
        <div class="flow-stop"><span class="flow-pin red" aria-hidden="true"><svg viewBox="0 0 24 24">
              <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" />
              <circle cx="12" cy="10" r="2.5" />
            </svg></span>
          <div><small>To</small><strong id="sr-to">—</strong><span class="detail" id="sr-dropoff"></span></div>
        </div>
      </div>
      <div class="flow-divider"></div>
      <div class="flow-row"><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h3l2 11H6L5 3Zm3 11h9a3 3 0 0 1 3 3v3H9v-3a3 3 0 0 1 3-3" />
          <path d="M11 3h4l2 6" />
        </svg>
        <div><small>Seat</small><strong id="sr-seat">—</strong></div><svg class="chevron" viewBox="0 0 24 24"
          aria-hidden="true">
          <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
      </div>
      <div class="flow-row"><svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="7" r="4" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M4 21v-2a8 8 0 0 1 16 0v2Z" fill="none" stroke="currentColor" stroke-width="1.8" />
        </svg>
        <div><small>Passenger</small><strong id="sr-passenger">Passenger</strong></div>
      </div>
      <div class="flow-divider"></div>
      <div class="flow-datetime">
        <div class="flow-row"><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M16 3v4M8 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8" />
          </svg>
          <div><small>Date</small><strong id="sr-date">—</strong></div>
        </div>
        <div class="flow-row"><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8" />
            <path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" />
          </svg>
          <div><small>Time</small><strong id="sr-time">—</strong></div>
        </div>
      </div>
    </section>
    <div class="flow-actions"><button type="button" id="send-request" class="flow-primary">Request Seat</button><a
        class="flow-outline" href="booking.html" id="edit-seat">Change seat</a></div>
  </main>
  <p class="flow-foot">Ride Safe,<br>Ride Eco<span>ride</span></p>
  <div class="flow-toast" id="flow-toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
  <script src="services.js"></script>
  <script src="booking-flow.js"></script>
</body>

</html>
