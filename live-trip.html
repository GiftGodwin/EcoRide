<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Live trip | EcoRide</title>
  <link rel="icon" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>

<body class="">
  <header class="topbar wide solo-bar"><a class="brandlink" href="index.html"><img src="images/in%20app%20logo.svg"
        alt="EcoRide"></a>
    <nav aria-label="Top navigation"><a href="index.html">Home</a><a href="passenger-dashboard.html" class=active>Find a
        ride</a><a href="#">My rides</a><a href="#">Wallet</a><a href="#">Help</a></nav>
    <div class="tb-right"><button class="bell" type="button" aria-label="Notifications" data-ic="bell"></button>
      <div class="header-user" hidden><span class="avatar" aria-hidden="true"></span><span class="user-name"></span>
      </div>
    </div>
  </header>
  <main class="solo">
    <div class="live">
      <div class="bigmap" data-map role="img" aria-label="Live trip map"></div>
      <aside class="tripcard" aria-label="Trip status">
        <div class="eta">
          <h2>Heading to —</h2><strong>—</strong><span>— min, — km</span>
        </div>
        <div class="steps">
          <div class="stp"><i data-ic="pin"></i>
            <div><b>Picked up</b><small>—</small></div>
          </div>
          <div class="stp"><i data-ic="pin"></i>
            <div><b>On the way</b><small>Following the planned route</small></div>
          </div>
          <div class="stp"><i data-ic="pin"></i>
            <div><b>Drop-off</b><small>—</small></div>
          </div>
        </div>
        <div class="drv"><span class="photo">—<span class="vt"><i data-ic="check"></i></span></span>
          <div class="db"><b>—</b><span class="vf"><i data-ic="shield"></i>Verified in person by EcoRide</span><span
              class="plate">—</span><small class="muted">—</small></div>
          <a class="phone" href="#" aria-label="Call driver"><i data-ic="phone"></i></a>
        </div>
        <div class="acts"><button class="btn outline" type="button" data-share><i data-ic="share"></i>Share
            trip</button><a class="btn danger" href="#"><i data-ic="alert"></i>Get help</a></div>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="pages.js"></script>
</body>

</html>
