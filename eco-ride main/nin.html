<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>EcoRide</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bar"><a href="index.html"><img class="logo" src="images/in%20app%20logo.svg" alt="EcoRide"></a>
    </header>
    <button class="backlink" type="button" aria-label="Go back" data-i="back" onclick="history.back()"></button>
    <main class="panel">
        <h1>Enter NIN</h1>
        <p class="sub">Enter your <b>NIN number</b> to continue</p>
        <div class="field"><span data-i="hash"></span><span class="d"></span><input id="nin" placeholder="NIN Number"
                autocomplete="off"></div>
        <button class="btn" id="next" disabled>Continue</button>
    </main>
    <script src="app.js"></script>
    <script>
        const n = document.getElementById('nin'), nx = document.getElementById('next');
        n.focus();
        n.oninput = () => { nx.disabled = n.value.trim().length === 0 };
        n.onkeydown = e => { if (e.key === 'Enter' && !nx.disabled) nx.click() };
        nx.onclick = () => { if (!nx.disabled) go('face.html') };
    </script>
</body>

</html>
