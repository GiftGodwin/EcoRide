<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Create account | EcoRide</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bar"><a href="index.html"><img class="logo" src="images/in%20app%20logo.svg" alt="EcoRide"></a></header>
    <button class="backlink" type="button" onclick="history.back()">Back</button>
    <main class="panel">
        <h1>Create account</h1>
        <p class="sub">Sign up to start enjoying your rides with <span class="eco">Eco<i>Ride</i></span></p>
        <form class="auth-form" id="form" novalidate>
            <div class="tabs" id="tabs" role="tablist" aria-label="Sign up with" data-active="email">
                        <span class="pill" aria-hidden="true"></span>
                        <button type="button" role="tab" id="tab-email" data-mode="email"
                            aria-selected="true">Email</button>
                        <button type="button" role="tab" id="tab-phone" data-mode="phone" aria-selected="false"
                            tabindex="-1">Phone</button>
                    </div>

                    <div class="row">
                <div class="group">
                    <div class="field" data-f="first"><input id="first" autocomplete="given-name" placeholder="First name" aria-label="First name"></div>
                    <p class="err-msg" role="alert"></p>
                </div>
                <div class="group">
                    <div class="field" data-f="last"><input id="last" autocomplete="family-name" placeholder="Last name" aria-label="Last name"></div>
                    <p class="err-msg" role="alert"></p>
                </div>
            </div>
            <div class="group" id="g-email">
                        <div class="field" data-f="email"><input id="email" type="email" inputmode="email"
                                autocomplete="email" placeholder="Email address" aria-label="Email address"></div>
                        <p class="err-msg" role="alert"></p>
                    </div>

                    <div class="group" id="g-phone" hidden>
                        <div class="field" data-f="phone">
                            <span class="cc" aria-hidden="true">+234</span><span class="d"></span>
                            <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national"
                                placeholder="801 234 5678" aria-label="Phone number, Nigeria +234" maxlength="13">
                        </div>
                        <p class="err-msg" role="alert"></p>
                    </div>

                    <div class="group">
                <div class="field" data-f="password">
                    <input id="password" type="password" autocomplete="new-password" placeholder="Password (8+ characters)" aria-label="Password">
                    <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false">
                                <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1" />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                </div>
                <p class="err-msg" role="alert"></p>
            </div>
            <div class="or">or continue with</div>

                    <div class="social">
                        <button type="button" data-social="Google">
                            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#4285F4"
                                    d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.27-2.09 3.57-5.17 3.57-8.81z" />
                                <path fill="#34A853"
                                    d="M12 24c3.24 0 5.95-1.07 7.93-2.91l-3.87-3c-1.07.72-2.44 1.15-4.06 1.15-3.13 0-5.78-2.11-6.73-4.96H1.28v3.09A12 12 0 0 0 12 24z" />
                                <path fill="#FBBC05"
                                    d="M5.27 14.28a7.2 7.2 0 0 1 0-4.56V6.63H1.28a12 12 0 0 0 0 10.74l3.99-3.09z" />
                                <path fill="#EA4335"
                                    d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.44-3.44C17.94 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.63l3.99 3.09C6.22 6.86 8.87 4.75 12 4.75z" />
                            </svg>Google</button>
                        <button type="button" data-social="Apple">
                            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill="#1d1d1f"
                                    d="M16.37 1.43c0 1.14-.42 2.2-1.24 3.06-.88.93-1.94 1.47-3.1 1.38-.02-1.1.44-2.2 1.2-3 .87-.9 2.03-1.44 3.14-1.44zM20.5 17.3c-.55 1.27-.81 1.84-1.52 2.96-.99 1.57-2.39 3.53-4.12 3.54-1.54.02-1.94-1-4.03-.99-2.09 0-2.53 1.01-4.07 1-1.73-.02-3.05-1.78-4.04-3.35C.01 16.1-.28 11.14 1.43 8.5c1.21-1.87 3.13-2.97 4.93-2.97 1.83 0 2.98 1 4.49 1 1.47 0 2.36-1 4.48-1 1.6 0 3.3.87 4.51 2.38-3.96 2.17-3.32 7.83.66 9.39z" />
                            </svg>Apple</button>
                    </div>

                    <p class="legal">By continuing, you agree to EcoRide's <a href="#">Terms of Service</a> and <a
                            href="#">Privacy Policy</a>.</p>

                    <button class="btn" id="next" type="submit" disabled>Continue</button>
        </form>
        <p class="switch">Already have an account? <a href="login.html">Log In</a></p>
    </main>
    <script src="app.js"></script>
    <script>
        const $ = id => document.getElementById(id), nx = $('next');
        let mode = 'email';
        const nat = v => v.replace(/\D/g, '').replace(/^234/, '').replace(/^0/, '');
        const rules = {
            email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Enter a valid email, like name@example.com',
            phone: v => /^[789][01]\d{8}$/.test(nat(v)) || 'Enter a valid Nigerian number, like 801 234 5678',
            first: v => v.trim().length >= 2 || 'Enter your first name',
            last: v => v.trim().length >= 2 || 'Enter your last name',
            password: v => v.length >= 8 || 'Use at least 8 characters'
        };
        const keys = () => ['first', 'last', mode, 'password'];
        const check = k => rules[k]($(k).value) === true;
        const show = (k, on) => {
            const b = $(k).closest('.group'), r = rules[k]($(k).value);
            b.querySelector('.field').classList.toggle('invalid', on && r !== true);
            b.querySelector('.err-msg').textContent = on && r !== true ? r : '';
        };
        const sync = () => { nx.disabled = !keys().every(check) };
        Object.keys(rules).forEach(k => {
            const el = $(k);
            el.oninput = () => { if (el.closest('.field').classList.contains('invalid')) show(k, true); sync() };
            el.onblur = () => { if (el.value) show(k, true) };
        });
        $('phone').addEventListener('input', e => {
            const d = nat(e.target.value).slice(0, 10);
            e.target.value = [d.slice(0, 3), d.slice(3, 6), d.slice(6)].filter(Boolean).join(' ');
        });
        const tabs = $('tabs');
        function setMode(m, focus) {
            mode = m; tabs.dataset.active = m;
            tabs.querySelectorAll('[role=tab]').forEach(t => { const on = t.dataset.mode === m; t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1 });
            ['email', 'phone'].forEach(k => {
                const g = $('g-' + k), on = k === m; g.hidden = !on;
                if (!on) { g.querySelector('.field').classList.remove('invalid'); g.querySelector('.err-msg').textContent = '' }
            });
            sync(); if (focus) $(m).focus();
        }
        tabs.querySelectorAll('[role=tab]').forEach(t => {
            t.onclick = () => setMode(t.dataset.mode, true);
            t.onkeydown = e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const m = mode === 'email' ? 'phone' : 'email'; setMode(m, false); $('tab-' + m).focus() } };
        });
        document.querySelectorAll('[data-social]').forEach(b => b.onclick = () =>
            toast(b.dataset.social + ' sign-up isn\'t available yet. Use your email or phone number for now.'));
        $('form').onsubmit = e => {
            e.preventDefault(); keys().forEach(k => show(k, true));
            if (!keys().every(check)) return;
            const body = { firstName: $('first').value.trim(), lastName: $('last').value.trim(), password: $('password').value };
            if (mode === 'email') body.email = $('email').value.trim().toLowerCase(); else body.phone = '+234' + nat($('phone').value);
            busy(nx, async () => {
                try {
                    await api('/api/auth/register', { method: 'POST', body });
                    store.set('name', body.firstName);
                    if (mode === 'email') { store.set('email', body.email); localStorage.removeItem('eco_phone') }
                    else { store.set('phone', body.phone); localStorage.removeItem('eco_email') }
                    go('role.html');
                } catch (err) { toast(err.message) }
            });
        };
        $('eye').onclick = e => {
            const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
            b.setAttribute('aria-pressed', on);
            b.setAttribute('aria-label', on ? 'Hide password' : 'Show password');
            $('password').type = on ? 'text' : 'password';
        };
        $('first').focus();
    </script>
</body>

</html>
