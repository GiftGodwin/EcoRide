<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Booking request | EcoRide</title>
  <link rel="icon" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pages.css">
</head>

<body>
  <div class="boxed tint">
    <div class="boxed-top"><a href="index.html" aria-label="EcoRide home"><img src="images/in%20app%20logo.svg"
          alt="EcoRide"></a><a class="help" href="#"><i data-ic="help"></i>Help &amp; support</a></div>
    <div class="frame">
      <nav class="sidecard" aria-label="Main navigation"><a href="driver-dashboard.html"><i
            data-ic="home"></i>Dashboard</a><a href="#"><i data-ic="car"></i>My Rides</a><a class="active" href="#"><i
            data-ic="card"></i>Payments</a><a href="earnings.html"><i data-ic="coins"></i>Earnings</a><a href="#"><i
            data-ic="user"></i>Profile</a>
        <hr><a class="quiet" href="#"><i data-ic="settings"></i>Settings</a><a class="quiet" href="login.html"
          data-logout><i data-ic="logout"></i>Log out</a>
      </nav>
      <main class="panel" data-page="booking-request">
        <h1 style="font-size:30px">Booking Request</h1>
        <div class="form-stack">
          <span class="lab">From</span>
          <div class="field"><i data-ic="pin"></i><input id="br-from" aria-label="From" readonly></div>
          <span class="lab">To</span>
          <div class="field"><i class="red" data-ic="pin"></i><input id="br-to" aria-label="To" readonly></div>
          <div class="lab">Date &amp; Time</div>
          <div class="field dt"><i data-ic="calendar"></i><input id="br-date" aria-label="Date" readonly><i
              data-ic="clock"></i><input id="br-time" aria-label="Time" readonly></div>
          <div class="row2">
            <div><span class="lab">Available Seats</span>
              <div class="stepper"><input id="br-seats" aria-label="Available seats" readonly></div>
            </div>
            <div><span class="lab">Fare (per seat)</span>
              <div class="money"><b>₦</b><input id="br-fare" aria-label="Fare per seat" readonly></div>
            </div>
          </div>
          <div class="br-actions"><button class="br-decline" id="br-decline" type="button">Decline</button><button
              class="btn" id="br-accept" type="button">Accept</button></div>
        </div>
      </main>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
  <script src="services.js"></script>
  <script src="pages.js"></script>
  <script src="connect.js"></script>
</body>

</html>
