<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SOS options | EcoRide</title>
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="flow.css">
    <style>
        .sos-options {
            max-width: 560px;
            margin: 0 auto
        }

        .sos-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #c93232;
            color: #fff;
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            font-size: 24px
        }

        .sos-options h2 {
            text-align: center;
            margin: 0 0 6px
        }

        .sos-options p {
            text-align: center;
            color: var(--flow-muted);
            font-size: 13px
        }

        .sos-choice {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            text-align: left;
            border: 1px solid var(--flow-line);
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer
        }

        .sos-choice strong {
            display: block
        }

        .sos-choice small {
            display: block;
            color: var(--flow-muted);
            margin-top: 3px
        }

        .sos-choice.emergency {
            background: #c93232;
            color: #fff;
            border-color: #c93232
        }

        .sos-choice.emergency small {
            color: #fff
        }

        .sos-choice span {
            font-size: 22px
        }

        .cancel {
            width: 100%;
            margin-top: 10px
        }
    </style>
</head>

<body>
    <div class="shell">
        <aside class="side"><a class="brand" href="index.html"><img src="images/in%20app%20logo.svg" alt="EcoRide"></a>
            <nav><a href="passenger-dashboard.html"><i data-ic="home"></i>Home</a><a href="live-trip.html"
                    class="active"><i data-ic="car"></i>My Rides</a><a href="dashboard.html"><i
                        data-ic="wallet"></i>Wallet</a><a href="safety-feedback.html"><i data-ic="help"></i>Help</a>
            </nav>
            <p class="side-foot">Ride Safe,<br>Ride Eco<em>ride</em></p>
        </aside>
        <main class="main">
            <header class="greet"><a class="mlogo" href="index.html"><img src="images/in%20app%20logo.svg"
                        alt="EcoRide"></a>
                <div>
                    <h1>Trip safety</h1>
                    <p>Choose the support you need.</p>
                </div>
            </header>
            <section class="flow-main narrow">
                <article class="flow-card">
                    <div class="flow-map"><span class="flow-map-label" data-pickup>Pickup location</span><span
                            class="flow-map-label right" data-to>Destination</span><span class="flow-route"></span><span
                            class="flow-pin"></span><span class="flow-car">▰</span></div>
                    <div class="flow-pad sos-options">
                        <div class="sos-icon">!</div>
                        <h2>Are you in danger?</h2>
                        <p>Get help immediately. Choose an option below to activate SOS.</p><button
                            class="sos-choice emergency" id="emergency"><span>☎</span>
                            <div><strong>Call Emergency Service</strong><small>Police · Ambulance · Fire</small></div>
                        </button><button class="sos-choice" id="share-location"><span>⌖</span>
                            <div><strong>Share My Live Location</strong><small>Let trusted contacts and our team
                                    know</small></div>
                        </button><button class="sos-choice" id="trusted"><span>♙</span>
                            <div><strong>Contact Trusted Person</strong><small>Notify someone you trust</small></div>
                        </button><button class="sos-choice" id="report"><span>△</span>
                            <div><strong>Report an Incident</strong><small>Tell us what happened</small></div>
                        </button><a class="flow-btn outline cancel" href="live-trip.html">Cancel</a>
                    </div>
                </article>
            </section>
        </main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
    <script src="services.js"></script>
    <script src="pages.js"></script>
    <script src="flow.js"></script>
    <script>document.getElementById('emergency').onclick = async () => { try { const t = new URLSearchParams(location.search).get('trip') || sessionStorage.getItem('eco_trip_id'); if (!t) throw new Error('No active trip was found.'); await api('/api/incidents/trip/' + encodeURIComponent(t), { method: 'POST', body: { type: 'emergency', severity: 'critical', description: 'Emergency service requested from the safety menu.' } }); toast('Emergency incident sent to EcoRide. Call local emergency services now.'); } catch (e) { toast(e.message) } }; document.getElementById('share-location').onclick = () => toast('Live-location sharing will be available when a trusted contact is configured.'); document.getElementById('trusted').onclick = () => toast('Add a trusted contact in Profile to use this action.'); document.getElementById('report').onclick = () => location.href = 'safety-feedback.html' + location.search;</script>
</body>

</html>
