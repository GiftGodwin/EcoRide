<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Complete trip | EcoRide</title>
    <link rel="icon" href="images/favicon.svg">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="flow.css">
</head>

<body>
    <div class="shell">
        <aside class="side"><a class="brand" href="index.html"><img src="images/in%20app%20logo.svg" alt="EcoRide"></a>
            <nav><a href="driver-dashboard.html" class="active"><i data-ic="home"></i>Home</a><a
                    href="driver-dashboard.html"><i data-ic="car"></i>My Trips</a><a href="publish-ride.html"><i
                        data-ic="calendar"></i>Schedule</a><a href="earnings.html"><i
                        data-ic="wallet"></i>Earnings</a><a href="driver-profile.html"><i
                        data-ic="user"></i>Profile</a><a href="safety-feedback.html"><i data-ic="help"></i>Help</a>
            </nav>
            <p class="side-foot">Ride Safe,<br>Ride Eco<em>ride</em></p>
        </aside>
        <main class="main">
            <header class="greet"><a class="mlogo" href="index.html"><img src="images/in%20app%20logo.svg"
                        alt="EcoRide"></a>
                <div>
                    <h1>Trip in Progress</h1>
                    <p>Complete the trip when your passenger has been dropped off.</p>
                </div>
                <div class="tb-right"><button class="bell" data-ic="bell" aria-label="Notifications"></button>
                    <div class="header-user" hidden><span class="avatar"></span><span class="user-name"></span></div>
                </div>
            </header>
            <section class="flow-main narrow">
                <article class="flow-card">
                    <div class="flow-map"><span class="flow-map-label" data-pickup>Pickup location</span><span
                            class="flow-map-label right" data-to>Destination</span><span class="flow-route"></span><span
                            class="flow-pin"></span><span class="flow-car">▰</span></div>
                    <div class="flow-pad">
                        <div class="flow-meta"><span class="flow-avatar" data-driver>—</span>
                            <div><strong data-driver>—</strong><small><span data-vehicle>—</span> · <span
                                        data-plate>—</span></small></div>
                        </div>
                        <div class="flow-info">
                            <div><small>Pickup location</small><b data-pickup>—</b></div>
                            <div><small>Destination</small><b data-to>—</b></div>
                            <div><small>Booking</small><b data-price>₦ —</b></div>
                        </div>
                        <div class="flow-actions"><button class="flow-btn" id="complete-trip">Trip Completed</button><a
                                class="flow-btn outline" href="sos.html">Get help</a></div>
                    </div>
                </article>
            </section>
        </main>
    </div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
    <script src="services.js"></script>
    <script src="pages.js"></script>
    <script src="flow.js"></script>
</body>

</html>
