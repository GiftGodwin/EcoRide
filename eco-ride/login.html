<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Log in | EcoRide</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="bar"><a href="index.html"><img class="logo" src="images/in%20app%20logo.svg" alt="EcoRide"></a></header>
    <button class="backlink" type="button" aria-label="Go back" data-i="back" onclick="history.back()"></button>
    <main class="panel">
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to your <span class="eco">Eco<i>Ride</i></span> account</p>
        <form class="auth-form" id="form" novalidate>
            <div class="tabs" id="tabs" role="tablist" aria-label="Log in with" data-active="email">
                        <span class="pill" aria-hidden="true"></span>
                        <button type="button" role="tab" id="tab-email" data-mode="email"
                            aria-selected="true">Email</button>
                        <button type="button" role="tab" id="tab-phone" data-mode="phone" aria-selected="false"
                            tabindex="-1">Phone</button>
                    </div>

                    <div class="group" id="g-email">
                        <div class="field" data-f="email"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="email" type="email" inputmode="email"
                                autocomplete="email" placeholder="Email address" aria-label="Email address"></div>
                        <p class="err-msg" role="alert"></p>
                    </div>

                    <div class="group" id="g-phone" hidden>
                        <div class="field" data-f="phone">
                            <span class="cc" aria-hidden="true">+234</span><span class="d"></span>
                            <input id="phone" type="tel" inputmode="tel" autocomplete="tel-national"
                                placeholder="801 234 5678" aria-label="Phone number, Nigeria +234" maxlength="13">
                        </div>
                        <p class="err-msg" role="alert"></p>
                    </div>

                    <div class="group">
                        <div class="field" data-f="password"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            <input id="password" type="password" autocomplete="current-password"
                                placeholder="Password" aria-label="Password">
                            <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false">
                                <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1" />
                                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                                </svg>
                            </button>
                        </div>
                        <p class="err-msg" role="alert"></p>
                    </div>

                    <div class="aux">
                        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
                        <a href="#" id="forgot">Forgot password?</a>
                    </div>

                    <button class="btn" id="next" type="submit" disabled>Continue</button>
        </form>
        <p class="switch">Don't have an account? <a href="signup.html">Create account</a></p>
    </main>
    <script src="app.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const nx = $('next');
        let mode = 'email';
        const nat = v => v.replace(/\D/g, '').replace(/^234/, '').replace(/^0/, '');
        const rules = {
            email: v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) || 'Enter a valid email, like name@example.com',
            phone: v => /^[789][01]\d{8}$/.test(nat(v)) || 'Enter a valid Nigerian number, like 801 234 5678',
            password: v => v.length > 0 || 'Enter your password'
        };
        const keys = () => [mode, 'password'];

        const check = k => rules[k]($(k).value) === true;
        const show = (k, on) => {
            const box = $(k).closest('.group');
            const r = rules[k]($(k).value);
            box.querySelector('.field').classList.toggle('invalid', on && r !== true);
            box.querySelector('.err-msg').textContent = on && r !== true ? r : '';
        };
        const sync = () => { nx.disabled = !keys().every(check) };

        Object.keys(rules).forEach(k => {
            const el = $(k);
            el.oninput = () => { if (el.closest('.field').classList.contains('invalid')) show(k, true); sync() };
            el.onblur = () => { if (el.value) show(k, true) };
        });

        $('phone').addEventListener('input', e => {
            const d = nat(e.target.value).slice(0, 10);
            e.target.value = [d.slice(0, 3), d.slice(3, 6), d.slice(6)].filter(Boolean).join(' ');
        });

        const tabs = $('tabs');
        function setMode(m, focus) {
            mode = m;
            tabs.dataset.active = m;
            tabs.querySelectorAll('[role=tab]').forEach(t => {
                const on = t.dataset.mode === m;
                t.setAttribute('aria-selected', on);
                t.tabIndex = on ? 0 : -1;
            });
            ['email', 'phone'].forEach(k => {
                const g = $('g-' + k), on = k === m;
                g.hidden = !on;
                if (!on) { g.querySelector('.field').classList.remove('invalid'); g.querySelector('.err-msg').textContent = '' }
            });
            sync();
            if (focus) $(m).focus();
        }
        tabs.querySelectorAll('[role=tab]').forEach(t => {
            t.onclick = () => setMode(t.dataset.mode, true);
            t.onkeydown = e => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    const m = mode === 'email' ? 'phone' : 'email';
                    setMode(m, false); $('tab-' + m).focus();
                }
            };
        });

        $('eye').onclick = e => {
            const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true';
            b.setAttribute('aria-pressed', on);
            b.setAttribute('aria-label', on ? 'Hide password' : 'Show password');
            $('password').type = on ? 'text' : 'password';
        };

        $('forgot').onclick = e => { e.preventDefault(); toast('Password reset isn\'t available yet.') };

        document.querySelectorAll('[data-social]').forEach(b => b.onclick = () =>
            toast(b.dataset.social + ' log-in isn\'t available yet. Use your email or phone number for now.'));

        // remember the last identifier (never the password)
        const saved = store.get('login_id');
        if (saved) { if (saved.startsWith('+234')) { setMode('phone'); $('phone').value = saved.slice(4).replace(/(\d{3})(\d{3})(\d+)/, '$1 $2 $3') } else $('email').value = saved; $('remember').checked = true; sync() }

        $('form').onsubmit = e => {
            e.preventDefault();
            keys().forEach(k => show(k, true));
            if (!keys().every(check)) return;
            const id = mode === 'email' ? $('email').value.trim().toLowerCase() : '+234' + nat($('phone').value);
            const body = { password: $('password').value };
            body[mode] = id;
            busy(nx, async () => {
                try {
                    const d = await api('/api/auth/login', { method: 'POST', body });
                    const account = d?.user || d?.data?.user || d?.data || d;
                    const displayName = account?.firstName || account?.first_name || account?.name || account?.fullName || account?.email || account?.phone || id;
                    if (displayName) store.set('name', displayName);
                    if ($('remember').checked) store.set('login_id', id); else localStorage.removeItem('eco_login_id');
                    const role = d?.role || d?.user?.role || store.get('role');
                    if (d?.role || d?.user?.role) store.set('role', role);
                    const verified = d?.verified ?? d?.user?.verified;
                    if (verified === false) go('nin.html');
                    else go('index.html');
                } catch (err) { toast(err.message) }
            });
        };

        $(mode).focus();
    </script>
</body>

</html>
